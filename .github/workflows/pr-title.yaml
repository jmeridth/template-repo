## Reference: https://github.com/amannn/action-semantic-pull-request
---
name: "Lint PR Title"
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
permissions: {}
concurrency:
  # PR number is unique per pull request, avoiding cross-PR group collisions that
  # author-controlled head_ref can cause when two PRs share a source branch name.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  lint_pr_title:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/pr-title.yaml@ee8277bd76ef808b3a6e0bdd1f5a46a520a12c5d # v2.3.1
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
